<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#1b5e20">

  <title>Southport Flower Show Automower Enquiry</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f1f3f1;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont,
                   "SF Pro Display", "SF Pro Text",
                   Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding:
        calc(20px + env(safe-area-inset-top))
        18px
        calc(35px + env(safe-area-inset-bottom));
    }

    /* HEADER */

    .header {
      text-align: center;
      background: #111;
      color: white;
      margin: -20px -18px 25px;
      padding: 32px 20px 28px;
      border-bottom: 6px solid #4caf50;
    }

    .header h1 {
      font-size: 27px;
      line-height: 1.15;
      margin: 0 0 10px;
      font-weight: 800;
    }

    .header p {
      margin: 0;
      color: #ddd;
      font-size: 15px;
    }

    .green-line {
      width: 55px;
      height: 4px;
      background: #4caf50;
      margin: 15px auto 0;
      border-radius: 4px;
    }

    /* FORM */

    .form-card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      border-top: 4px solid #4caf50;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .required {
      color: #4caf50;
    }

    input,
    textarea {
      width: 100%;
      border: 1.5px solid #c9cec9;
      border-radius: 11px;
      background: #f8f9f8;
      padding: 15px;
      font-size: 17px;
      font-family: inherit;
      color: #111;
      outline: none;
      -webkit-appearance: none;
    }

    input {
      height: 52px;
    }

    textarea {
      min-height: 105px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #4caf50;
      background: white;
      box-shadow: 0 0 0 3px rgba(76,175,80,.15);
    }

    /* BUTTONS */

    .submit-button {
      width: 100%;
      height: 55px;
      border: none;
      border-radius: 13px;
      background: #4caf50;
      color: white;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 3px 8px rgba(0,0,0,.18);
      cursor: pointer;
    }

    .submit-button:active {
      transform: scale(.98);
      background: #388e3c;
    }

    /* SUCCESS */

    .success {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 11px;
      background: #e8f5e9;
      color: #1b5e20;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid #a5d6a7;
    }

    /* SAVED ENQUIRIES */

    .saved-section {
      margin-top: 28px;
    }

    .saved-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .saved-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .count {
      background: #111;
      color: white;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }

    .record {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      border-left: 4px solid #4caf50;
    }

    .record-name {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .record-details {
      color: #555;
      font-size: 14px;
      line-height: 1.55;
    }

    .record-date {
      color: #888;
      font-size: 12px;
      margin-top: 8px;
    }

    .delete-button {
      width: auto;
      height: auto;
      padding: 8px 13px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 14px;
      font-weight: 600;
    }

    /* ACTION BUTTONS */

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .action-button {
      min-height: 48px;
      border: none;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .export-button {
      background: #4caf50;
      color: white;
    }

    .delete-all-button {
      background: #111;
      color: white;
    }

    .action-button:active {
      transform: scale(.97);
    }

    .empty {
      background: white;
      border-radius: 14px;
      padding: 20px;
      color: #777;
      text-align: center;
      font-size: 14px;
    }

    .privacy-note {
      text-align: center;
      color: #777;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 20px;
    }

    @media (min-width: 600px) {
      .container {
        padding-top: 45px;
      }

      .header {
        margin: -45px -18px 30px;
        padding-top: 40px;
      }
    }
  </style>
</head>

<body>

<main class="container">

  <header class="header">
    <h1>
      Southport Flower Show<br>
      Automower Enquiry
    </h1>

    <p>
      Complete your details below and we'll be in touch.
    </p>

    <div class="green-line"></div>
  </header>


  <!-- ENQUIRY FORM -->

  <section class="form-card">

    <form id="contactForm">

      <div class="field">
        <label for="name">
          Name <span class="required">*</span>
        </label>

        <input
          type="text"
          id="name"
          placeholder="Enter your name"
          autocomplete="name"
          required
        >
      </div>


      <div class="field">
        <label for="address">
          Address <span class="required">*</span>
        </label>

        <textarea
          id="address"
          placeholder="Enter your address"
          autocomplete="street-address"
          required
        ></textarea>
      </div>


      <div class="field">
        <label for="phone">
          Contact Number <span class="required">*</span>
        </label>

        <input
          type="tel"
          id="phone"
          placeholder="Enter your contact number"
          autocomplete="tel"
          inputmode="tel"
          required
        >
      </div>


      <div class="field">
        <label for="email">
          Email Address <span class="required">*</span>
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email address"
          autocomplete="email"
          inputmode="email"
          required
        >
      </div>


      <button
        type="submit"
        class="submit-button">
        Submit Enquiry
      </button>

    </form>


    <div
      id="successMessage"
      class="success">
      ✓ Enquiry saved successfully on this iPhone.
    </div>

  </section>


  <!-- SAVED ENQUIRIES -->

  <section class="saved-section">

    <div class="saved-header">
      <h2>Saved Enquiries</h2>
      <span class="count" id="recordCount">0</span>
    </div>

    <div id="records"></div>


    <div class="actions">

      <button
        class="action-button export-button"
        onclick="exportCSV()">
        Export CSV
      </button>

      <button
        class="action-button delete-all-button"
        onclick="deleteAll()">
        Delete All
      </button>

    </div>


    <div class="privacy-note">
      Enquiries are stored locally on this iPhone.
      They are not automatically sent anywhere.
    </div>

  </section>

</main>


<script>

  const form =
    document.getElementById("contactForm");

  const recordsContainer =
    document.getElementById("records");

  const successMessage =
    document.getElementById("successMessage");

  const recordCount =
    document.getElementById("recordCount");


  /* LOAD SAVED ENQUIRIES */

  let records = JSON.parse(
    localStorage.getItem("automowerEnquiries") || "[]"
  );


  /* SAVE */

  function saveRecords() {

    localStorage.setItem(
      "automowerEnquiries",
      JSON.stringify(records)
    );

  }


  /* DISPLAY */

  function displayRecords() {

    recordsContainer.innerHTML = "";

    recordCount.textContent = records.length;


    if (records.length === 0) {

      recordsContainer.innerHTML =
        '<div class="empty">' +
        'No enquiries saved yet.' +
        '</div>';

      return;
    }


    records.forEach((record, index) => {

      const div =
        document.createElement("div");

      div.className = "record";


      div.innerHTML = `

        <div class="record-name">
          ${escapeHTML(record.name)}
        </div>

        <div class="record-details">

          <strong>Address:</strong><br>

          ${escapeHTML(record.address)
            .replace(/\n/g, "<br>")}

          <br><br>

          <strong>Phone:</strong>
          ${escapeHTML(record.phone)}

          <br>

          <strong>Email:</strong>
          ${escapeHTML(record.email)}

        </div>

        <div class="record-date">
          ${escapeHTML(record.date)}
        </div>

        <button
          class="delete-button"
          onclick="deleteRecord(${index})">
          Delete
        </button>

      `;


      recordsContainer.appendChild(div);

    });

  }


  /* SECURITY */

  function escapeHTML(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }


  /* DELETE ONE */

  function deleteRecord(index) {

    if (
      confirm("Delete this enquiry?")
    ) {

      records.splice(index, 1);

      saveRecords();

      displayRecords();

    }

  }


  /* DELETE EVERYTHING */

  function deleteAll() {

    if (records.length === 0) {

      alert("There are no enquiries to delete.");

      return;
    }


    if (
      confirm(
        "Are you sure you want to delete ALL enquiries?"
      )
    ) {

      records = [];

      saveRecords();

      displayRecords();

    }

  }


  /* EXPORT CSV */

  function exportCSV() {

    if (records.length === 0) {

      alert(
        "There are no enquiries to export."
      );

      return;

    }


    let csv =
      "Date,Name,Address,Contact Number,Email Address\n";


    records.forEach(record => {

      csv += [
        csvEscape(record.date),
        csvEscape(record.name),
        csvEscape(record.address),
        csvEscape(record.phone),
        csvEscape(record.email)
      ].join(",") + "\n";

    });


    const blob =
      new Blob(
        [csv],
        { type: "text/csv;charset=utf-8;" }
      );


    const url =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");

    link.href = url;

    link.download =
      "southport-flower-show-automower-enquiries.csv";


    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);

  }


  /* CSV ESCAPING */

  function csvEscape(value) {

    value = String(value || "");

    return '"' +
      value.replace(/"/g, '""') +
      '"';

  }


  /* SUBMIT FORM */

  form.addEventListener(
    "submit",
    function(event) {

      event.preventDefault();


      const now =
        new Date();


      const record = {

        date:
          now.toLocaleString(
            "en-GB",
            {
              day: "2-digit",
              month: "2-digit",
              year: "numeric",
              hour: "2-digit",
              minute: "2-digit"
            }
          ),

        name:
          document
            .getElementById("name")
            .value
            .trim(),

        address:
          document
            .getElementById("address")
            .value
            .trim(),

        phone:
          document
            .getElementById("phone")
            .value
            .trim(),

        email:
          document
            .getElementById("email")
            .value
            .trim()

      };


      records.push(record);

      saveRecords();

      displayRecords();

      form.reset();


      successMessage.style.display =
        "block";


      setTimeout(() => {

        successMessage.style.display =
          "none";

      }, 4000);


      window.scrollTo({

        top: 0,

        behavior: "smooth"

      });

    }
  );


  /* INITIAL DISPLAY */

  displayRecords();

</script>

</body>
</html>
